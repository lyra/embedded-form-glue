<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
      name="viewport"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Glue testing view</title>

    <!-- the component we want to test -->
    <script src="/dist/js/kr-payment-form-glue.min.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', event => {
        const publicKey =
          '69876357:testpublickey_DEMOPUBLICKEY95me92597fd28tGD4r5'
        const domain = '~~CHANGE_ME_ENDPOINT~~'

        KRGlue.configure({ domain })
        const loadKrypton = async () => {
          await KRGlue.loadTheme('neon')
          return KRGlue.loadLibrary({ publicKey })
        }

        loadKrypton()
          .then(({ KR }) =>
            KR.setFormConfig({
              formToken: 'DEMO-TOKEN-TO-BE-REPLACED',
              language: 'en-EN'
            })
          )
          .then(({ KR }) => KR.renderElements('#myPaymentForm'))
          .then(() => {
            KR.onFormReady(() => {
              let el = document.createElement('div')
              el.id = 'test-ready'
              document.body.appendChild(el)
            })
          })
      })
    </script>
  </head>

  <body>
    <div id="myPaymentForm">
      <div class="kr-embedded"></div>
    </div>
  </body>
</html>
